<!DOCTYPE html>
<html lang="en">
<head>
    <title>Lab 2 - Interactive Page</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="card" id="box">
        <h1 id="title">Interactive Interface</h1>
        <p id="description">Click the buttons below to change background.</p>

        <!-- Bg Image -->
        <div class="img-container">
            <img id="toChange" src="image/bg.avif" alt="Display Image">
        </div>

        <div class="btn-group">
            <button onclick="changePage()">Click Me!</button>
            <button onclick="openPopupWindow()">Open Window</button>
        </div>

        <p id="result"></p>
    </div>

    <!-- JS -->
    <script src="js/script.js"></script>
</body>
</html>
